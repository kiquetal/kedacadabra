apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-cronjob-sa
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keda-cronjob-role
  namespace: apps
rules:
- apiGroups: ["keda.sh"]
  resources: ["scaledobjects"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keda-cronjob-rolebinding
  namespace: apps
subjects:
- kind: ServiceAccount
  name: keda-cronjob-sa
  namespace: apps
roleRef:
  kind: Role
  name: keda-cronjob-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keda-pause-api-gateway
  namespace: apps
spec:
  schedule: "14 15 19 3 *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: keda-cronjob-sa
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: registry.k8s.io/kubectl:v1.32.0
            command:
            - kubectl
            - annotate
            - scaledobject
            - api-gateway-scaler
            - -n
            - apps
            - autoscaling.keda.sh/paused-replicas=0
            - --overwrite
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keda-resume-api-gateway
  namespace: apps
spec:
  schedule: "16 15 19 3 *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: keda-cronjob-sa
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: registry.k8s.io/kubectl:v1.32.0
            command:
            - kubectl
            - annotate
            - scaledobject
            - api-gateway-scaler
            - -n
            - apps
            - autoscaling.keda.sh/paused-replicas-
            - --overwrite
